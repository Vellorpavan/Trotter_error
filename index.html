<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepWise-Q: Interactive 3D Quantum Simulation Laboratory (PS-S3)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; }
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- ICONS ---
    const IconActivity = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
    const IconPlay = () => <svg className="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>;
    const IconPause = () => <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" /></svg>;
    const IconRotate = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
    const IconCpu = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" strokeWidth="2"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 9h6v6H9zM9 1v3m6-3v3M9 20v3m6-3v3M1 9h3m-3 6h3M20 9h3m-3 6h3"/></svg>;
    const IconShield = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>;
    const IconBarChart = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
    const Icon3D = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>;

    // 1. SCIENTIFIC CONSTANTS
    const MODEL_CONFIG = {
      N: 4,
      J: 1.0,
      g: 1.0,
      T: 2.0,
      officialStepCounts: [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 14, 16],
      bonds: [[0, 1], [1, 2], [2, 3], [3, 0]]
    };

    const PROCESSORS = {
      A: {
        name: "Processor A (Tree - 5Q)",
        type: "Tree (5 physical qubits, no 4-cycle)",
        numPhysQubits: 5,
        nativeBonds: [[0, 1], [1, 2], [1, 3], [3, 4]],
        sqErr: 0.001,
        twoQErr: 0.005,
        readoutErr: 0.01,
        description: "Official 5-qubit tree: lacks periodic cycle (3,0). Requires SWAP routing (+21 CX at n=4)."
      },
      B: {
        name: "Processor B (Heavy-Hex - 9Q)",
        type: "Planar Heavy-Hex Graph (9 physical qubits)",
        numPhysQubits: 9,
        nativeBonds: [
          [0, 1], [1, 2], [1, 6], [2, 3], [2, 6], [2, 5],
          [3, 4], [4, 5], [5, 6], [6, 7], [6, 8], [8, 0]
        ],
        sqErr: 0.001,
        twoQErr: 0.005,
        readoutErr: 0.01,
        description: "Official 9-qubit graph with one 4-cycle. Asymmetric node degree 5."
      },
      D: {
        name: "Processor D (Custom 2x3 Ladder - 6Q)",
        type: "Co-Designed 2x3 Ladder (6 physical qubits)",
        numPhysQubits: 6,
        nativeBonds: [
          [0, 1], [1, 2], [3, 4], [4, 5],
          [0, 3], [1, 4], [2, 5]
        ],
        sqErr: 0.001,
        twoQErr: 0.005,
        readoutErr: 0.01,
        description: "StepWise-Q Co-Design: 6-qubit 2x3 ladder with TWO native 4-cycles. Max degree <= 3, diameter 3. 0 SWAP routing overhead."
      }
    };

    // Math & Quantum helpers
    const cAdd = (a, b) => ({ r: a.r + b.r, i: a.i + b.i });
    const cMul = (a, b) => ({ r: a.r * b.r - a.i * b.i, i: a.r * b.i + a.i * b.r });
    const cMagSq = (a) => a.r * a.r + a.i * a.i;
    const cExp = (phase) => ({ r: Math.cos(phase), i: Math.sin(phase) });

    function getInitialStatevector() {
      const psi = Array.from({ length: 16 }, () => ({ r: 0, i: 0 }));
      psi[10] = { r: 1.0, i: 0.0 }; // |1010>
      return psi;
    }

    function applyRx(state, qubit, theta) {
      const dim = state.length;
      const next = state.map(v => ({ ...v }));
      const half = theta / 2;
      const cos = Math.cos(half);
      const sin = Math.sin(half);
      for (let s = 0; s < dim; s++) {
        if (((s >> qubit) & 1) === 0) {
          const flipped = s ^ (1 << qubit);
          const a = state[s];
          const b = state[flipped];
          next[s] = { r: cos * a.r + sin * b.i, i: cos * a.i - sin * b.r };
          next[flipped] = { r: cos * b.r + sin * a.i, i: cos * b.i - sin * a.r };
        }
      }
      return next;
    }

    function applyRzz(state, q1, q2, theta) {
      const dim = state.length;
      const next = new Array(dim);
      const phiOver2 = theta / 2;
      for (let s = 0; s < dim; s++) {
        const bit1 = (s >> q1) & 1;
        const bit2 = (s >> q2) & 1;
        const parity = bit1 ^ bit2;
        const phase = parity === 0 ? -phiOver2 : phiOver2;
        next[s] = cMul(cExp(phase), state[s]);
      }
      return next;
    }

    function calculateStaggeredMagnetization(state) {
      let totalM = 0;
      for (let q = 0; q < 4; q++) {
        const sign = Math.pow(-1, q);
        let expZ = 0;
        for (let s = 0; s < 16; s++) {
          const bit = (s >> q) & 1;
          expZ += (bit === 0 ? 1 : -1) * cMagSq(state[s]);
        }
        totalM += sign * expZ;
      }
      return totalM / 4;
    }

    function computeReducedBlochVector(state, targetQubit) {
      let zExp = 0, xExp = 0, yExp = 0;
      for (let s = 0; s < 16; s++) {
        const prob = cMagSq(state[s]);
        const bit = (s >> targetQubit) & 1;
        zExp += (bit === 0 ? 1 : -1) * prob;
        if (bit === 0) {
          const flipped = s ^ (1 << targetQubit);
          const a0 = state[s];
          const a1 = state[flipped];
          xExp += 2 * (a0.r * a1.r + a0.i * a1.i);
          yExp += 2 * (a0.r * a1.i - a0.i * a1.r);
        }
      }
      const length = Math.sqrt(xExp * xExp + yExp * yExp + zExp * zExp);
      const purity = (1 + length * length) / 2;
      return { x: xExp, y: yExp, z: zExp, length, purity };
    }

    // Three.js Viewport Component
    function ThreeQuantumViewport({ activeQubit, onSelectQubit, processorKey, qubitBlochVectors }) {
      const mountRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const sceneRef = useRef(null);
      const blochVectorsRef = useRef([]);
      const qubitMeshesRef = useRef([]);
      const isDraggingRef = useRef(false);
      const prevMousePosRef = useRef({ x: 0, y: 0 });
      const cameraAngleRef = useRef({ theta: Math.PI / 4, phi: Math.PI / 3, radius: 14 });

      const currentProc = PROCESSORS[processorKey];

      // Node spatial positions
      const nodePositions = useMemo(() => {
        if (processorKey === 'A') {
          return [
            new THREE.Vector3(-4.0, 0, -2.0),
            new THREE.Vector3(-1.5, 0, 0.0),
            new THREE.Vector3(-4.0, 0, 2.0),
            new THREE.Vector3(1.5, 0, 0.0),
            new THREE.Vector3(4.0, 0, 0.0)
          ];
        } else if (processorKey === 'B') {
          const R = 4.5;
          const pos = [];
          for (let i = 0; i < 8; i++) {
            const angle = (i * 2 * Math.PI) / 8;
            pos.push(new THREE.Vector3(R * Math.cos(angle), 0, R * Math.sin(angle)));
          }
          pos.push(new THREE.Vector3(0, 0, 0));
          return pos;
        } else {
          // Processor D: 2x3 Ladder Grid (6 Qubits)
          const spacing = 3.5;
          const pos = [];
          for (let r = 0; r < 2; r++) {
            for (let c = 0; c < 3; c++) {
              pos.push(new THREE.Vector3((c - 1) * spacing, 0, (r - 0.5) * spacing));
            }
          }
          return pos;
        }
      }, [processorKey]);

      const updateCameraPosition = useCallback(() => {
        if (!cameraRef.current) return;
        const { theta, phi, radius } = cameraAngleRef.current;
        cameraRef.current.position.x = radius * Math.sin(phi) * Math.sin(theta);
        cameraRef.current.position.y = radius * Math.cos(phi);
        cameraRef.current.position.z = radius * Math.sin(phi) * Math.cos(theta);
        cameraRef.current.lookAt(0, 0.2, 0);
      }, []);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth || 800;
        const height = container.clientHeight || 450;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060a12);
        sceneRef.current = scene;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        cameraRef.current = camera;
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.innerHTML = '';
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light1 = new THREE.DirectionalLight(0x38bdf8, 1.2);
        light1.position.set(10, 15, 10);
        scene.add(light1);
        const light2 = new THREE.DirectionalLight(0x818cf8, 0.8);
        light2.position.set(-10, -5, -10);
        scene.add(light2);

        // Grid
        const grid = new THREE.GridHelper(16, 16, 0x1e293b, 0x0f172a);
        grid.position.y = -1.0;
        scene.add(grid);

        // Nodes
        qubitMeshesRef.current = [];
        blochVectorsRef.current = [];

        nodePositions.forEach((pos, idx) => {
          const qGroup = new THREE.Group();
          qGroup.position.copy(pos);

          // Stand
          const standGeo = new THREE.CylinderGeometry(0.5, 0.65, 0.6, 24);
          const standMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });
          const stand = new THREE.Mesh(standGeo, standMat);
          stand.position.y = -0.5;
          qGroup.add(stand);

          // Sphere enclosure
          const sphereGeo = new THREE.SphereGeometry(0.85, 20, 16);
          const sphereMat = new THREE.MeshStandardMaterial({
            color: 0x0f172a,
            transparent: true,
            opacity: 0.3,
            wireframe: true
          });
          const sphere = new THREE.Mesh(sphereGeo, sphereMat);
          sphere.position.y = 0.8;
          qGroup.add(sphere);

          // Bloch vector arrow
          const arrowGroup = new THREE.Group();
          arrowGroup.position.set(0, 0.8, 0);
          const shaft = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.03, 0.7, 12),
            new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 })
          );
          shaft.position.y = 0.35;
          arrowGroup.add(shaft);
          const cone = new THREE.Mesh(
            new THREE.ConeGeometry(0.09, 0.2, 12),
            new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 })
          );
          cone.position.y = 0.8;
          arrowGroup.add(cone);
          qGroup.add(arrowGroup);
          blochVectorsRef.current.push(arrowGroup);

          // Core
          const coreMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.4 });
          const core = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), coreMat);
          core.position.y = 0.8;
          qGroup.add(core);

          scene.add(qGroup);
          qubitMeshesRef.current.push({ qGroup, coreMat });
        });

        // Bonds
        currentProc.nativeBonds.forEach(([q1, q2]) => {
          if (!nodePositions[q1] || !nodePositions[q2]) return;
          const p1 = nodePositions[q1];
          const p2 = nodePositions[q2];
          const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
          const dist = p1.distanceTo(p2);

          const bus = new THREE.Mesh(
            new THREE.CylinderGeometry(0.06, 0.06, dist - 0.8, 12),
            new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x047857, emissiveIntensity: 0.4 })
          );
          bus.position.copy(mid);
          bus.position.y = -0.2;
          const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
          bus.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
          scene.add(bus);
        });

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(frameId);
          if (renderer.domElement && container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, [nodePositions, currentProc, updateCameraPosition]);

      // Update Bloch vectors & highlights
      useEffect(() => {
        nodePositions.forEach((_, qIdx) => {
          const bloch = (qubitBlochVectors && qubitBlochVectors[qIdx]) || { x: 0, y: 0, z: 1, length: 1 };
          const arrow = blochVectorsRef.current[qIdx];
          const qObj = qubitMeshesRef.current[qIdx];

          if (arrow) {
            const dir = new THREE.Vector3(bloch.x, bloch.z, bloch.y).normalize();
            if (dir.lengthSq() > 0.001) {
              arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
            }
          }

          if (qObj) {
            if (activeQubit === qIdx) {
              qObj.coreMat.color.setHex(0x00f0ff);
              qObj.coreMat.emissive.setHex(0x0284c7);
              qObj.coreMat.emissiveIntensity = 1.0;
            } else {
              qObj.coreMat.color.setHex(0x64748b);
              qObj.coreMat.emissive.setHex(0x1e293b);
              qObj.coreMat.emissiveIntensity = 0.2;
            }
          }
        });
      }, [nodePositions, qubitBlochVectors, activeQubit]);

      const onMouseDown = (e) => {
        isDraggingRef.current = true;
        prevMousePosRef.current = { x: e.clientX, y: e.clientY };
      };
      const onMouseMove = (e) => {
        if (!isDraggingRef.current) return;
        const dx = e.clientX - prevMousePosRef.current.x;
        const dy = e.clientY - prevMousePosRef.current.y;
        prevMousePosRef.current = { x: e.clientX, y: e.clientY };
        cameraAngleRef.current.theta += dx * 0.008;
        cameraAngleRef.current.phi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, cameraAngleRef.current.phi - dy * 0.008));
        updateCameraPosition();
      };
      const onMouseUp = () => { isDraggingRef.current = false; };

      return (
        <div className="relative w-full h-[450px] bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-2xl select-none">
          <div
            ref={mountRef}
            className="w-full h-full cursor-grab active:cursor-grabbing"
            onMouseDown={onMouseDown}
            onMouseMove={onMouseMove}
            onMouseUp={onMouseUp}
            onMouseLeave={onMouseUp}
          />
          <div className="absolute top-4 left-4 bg-slate-900/90 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-2">
            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" />
            <span className="font-semibold text-slate-100">{currentProc.name}</span>
          </div>
          <div className="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-1.5 bg-slate-900/95 backdrop-blur px-4 py-2 rounded-xl border border-slate-700 text-xs z-10">
            <span className="text-slate-400 mr-1 flex items-center gap-1 font-semibold"><IconCpu /> Inspect Qubit:</span>
            {nodePositions.map((_, idx) => (
              <button
                key={idx}
                onClick={() => onSelectQubit(idx)}
                className={`px-2 py-0.5 rounded font-mono font-medium transition ${
                  activeQubit === idx ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                P{idx}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // Main App
    function App() {
      const [trotterSteps, setTrotterSteps] = useState(7);
      const [selectedProcessor, setSelectedProcessor] = useState("D");
      const [activeQubit, setActiveQubit] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [stepProgress, setStepProgress] = useState(1.0); // 0 to 1

      // Compute live state
      const liveState = useMemo(() => {
        const psi0 = getInitialStatevector();
        let psi = psi0.map(v => ({ ...v }));
        const effectiveSteps = Math.max(1, Math.round(trotterSteps * stepProgress));
        const dt = (MODEL_CONFIG.T / trotterSteps) * stepProgress;

        for (let s = 0; s < effectiveSteps; s++) {
          for (const [q1, q2] of MODEL_CONFIG.bonds) {
            psi = applyRzz(psi, q1, q2, -2 * MODEL_CONFIG.J * dt);
          }
          for (let q = 0; q < 4; q++) {
            psi = applyRx(psi, q, -2 * MODEL_CONFIG.g * dt);
          }
        }

        const mStag = calculateStaggeredMagnetization(psi);
        const blochVectors = Array.from({ length: 9 }, (_, q) => {
          if (q < 4) return computeReducedBlochVector(psi, q);
          return { x: 0, y: 0, z: 1, length: 1, purity: 1.0 };
        });

        return { psi, mStag, blochVectors };
      }, [trotterSteps, stepProgress]);

      // Playback loop
      useEffect(() => {
        let timer;
        if (isPlaying) {
          timer = setInterval(() => {
            setStepProgress(prev => {
              if (prev >= 1.0) {
                setIsPlaying(false);
                return 1.0;
              }
              return Math.min(1.0, prev + 0.05);
            });
          }, 150);
        }
        return () => clearInterval(timer);
      }, [isPlaying]);

      const selectedBloch = liveState.blochVectors[activeQubit] || { x: 0, y: 0, z: 1, length: 1, purity: 1 };
      const currentProc = PROCESSORS[selectedProcessor];

      return (
        <div className="w-full min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          {/* Header */}
          <header className="w-full bg-slate-900/90 backdrop-blur border-b border-slate-800 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-slate-950">
                <IconActivity />
              </div>
              <div>
                <h1 className="font-bold text-base text-slate-100 flex items-center gap-2">
                  StepWise-Q: Interactive 3D Quantum Simulation Lab
                  <span className="bg-cyan-500/10 text-cyan-400 text-xs px-2 py-0.5 rounded border border-cyan-500/30 font-mono">PS-S3</span>
                </h1>
                <p className="text-xs text-slate-400">Ring TFIM (N=4, J=1.0, g=1.0, T=2.0) on Processors A, B, and D</p>
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center gap-3 text-xs">
              <div className="flex items-center bg-slate-800 rounded-lg p-1 border border-slate-700">
                <span className="text-slate-400 px-2 font-medium">Processor:</span>
                {["A", "B", "D"].map(p => (
                  <button
                    key={p}
                    onClick={() => { setSelectedProcessor(p); setActiveQubit(0); }}
                    className={`px-3 py-1 rounded font-mono transition ${
                      selectedProcessor === p ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-300 hover:text-white'
                    }`}
                  >
                    Proc {p}
                  </button>
                ))}
              </div>

              <div className="flex items-center bg-slate-800 rounded-lg p-1 border border-slate-700">
                <span className="text-slate-400 px-2 font-medium">Steps (n):</span>
                <select
                  value={trotterSteps}
                  onChange={(e) => setTrotterSteps(parseInt(e.target.value))}
                  className="bg-slate-900 text-cyan-300 font-mono px-2 py-1 rounded border border-slate-700"
                >
                  {MODEL_CONFIG.officialStepCounts.map(n => <option key={n} value={n}>n = {n}</option>)}
                </select>
              </div>
            </div>
          </header>

          {/* Main Layout */}
          <main className="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              {/* 3D Viewport */}
              <div className="lg:col-span-7 space-y-4">
                <ThreeQuantumViewport
                  activeQubit={activeQubit}
                  onSelectQubit={setActiveQubit}
                  processorKey={selectedProcessor}
                  qubitBlochVectors={liveState.blochVectors}
                />

                {/* Qubit State Badge */}
                <div className="bg-slate-900 rounded-xl p-4 border border-slate-800 flex items-center justify-between text-xs font-mono">
                  <div>
                    <span className="text-slate-400 block text-[10px]">SELECTED QUBIT</span>
                    <span className="text-cyan-400 font-bold text-sm">P{activeQubit} ({currentProc.name})</span>
                    <span className="text-slate-400 block text-[11px] mt-0.5">
                      Bloch Vector: ({selectedBloch.x.toFixed(3)}, {selectedBloch.y.toFixed(3)}, {selectedBloch.z.toFixed(3)})
                    </span>
                  </div>
                  <div className="text-right">
                    <span className="text-slate-400 block text-[10px]">PURITY Tr(ρ²)</span>
                    <span className="text-emerald-400 font-bold text-sm">{selectedBloch.purity.toFixed(4)}</span>
                  </div>
                </div>

                {/* Timeline Controls */}
                <div className="bg-slate-900 rounded-xl p-4 border border-slate-800 flex items-center justify-between gap-4">
                  <button
                    onClick={() => setIsPlaying(!isPlaying)}
                    className="p-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition shadow"
                  >
                    {isPlaying ? <IconPause /> : <IconPlay />}
                  </button>
                  <button
                    onClick={() => { setIsPlaying(false); setStepProgress(0.0); }}
                    className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                    title="Reset Timeline"
                  >
                    <IconRotate />
                  </button>

                  <div className="flex-1 flex flex-col gap-1">
                    <div className="flex justify-between text-[11px] font-mono text-slate-400">
                      <span>Time t = 0.0s (Néel |1010⟩)</span>
                      <span className="text-cyan-400 font-bold">t = {(MODEL_CONFIG.T * stepProgress).toFixed(2)}s / 2.0s</span>
                      <span>T = 2.0s</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="1"
                      step="0.01"
                      value={stepProgress}
                      onChange={(e) => setStepProgress(parseFloat(e.target.value))}
                      className="w-full h-2 bg-slate-800 rounded appearance-none cursor-pointer accent-cyan-400"
                    />
                  </div>
                </div>
              </div>

              {/* Statevector Amplitudes & Observables */}
              <div className="lg:col-span-5 bg-slate-900 rounded-xl p-5 border border-slate-800 shadow-2xl flex flex-col gap-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="font-semibold text-sm text-slate-200 flex items-center gap-2">
                      <IconBarChart /> 16-Basis Statevector Amplitudes
                    </h3>
                    <p className="text-xs text-slate-400">Trotter Step Count: <span className="font-mono text-cyan-300">n = {trotterSteps}</span></p>
                  </div>
                  <div className="text-right font-mono">
                    <span className="text-[10px] text-slate-400 block uppercase">Staggered Magnetization</span>
                    <span className="text-sm font-bold text-cyan-400">{liveState.mStag.toFixed(4)}</span>
                  </div>
                </div>

                {/* 16-state histogram */}
                <div className="space-y-1.5 max-h-[360px] overflow-y-auto pr-1">
                  {liveState.psi.map((amp, idx) => {
                    const prob = cMagSq(amp);
                    const bits = idx.toString(2).padStart(4, '0');
                    const isNeel = bits === "1010";

                    return (
                      <div key={bits} className="flex items-center gap-2 text-xs font-mono">
                        <span className={`w-12 text-[11px] ${isNeel ? 'text-amber-400 font-bold' : 'text-slate-400'}`}>
                          |{bits}⟩
                        </span>
                        <div className="flex-1 bg-slate-800/80 h-3.5 rounded overflow-hidden">
                          <div
                            className={`h-full ${isNeel ? 'bg-amber-400' : 'bg-cyan-500'}`}
                            style={{ width: `${Math.max(0, Math.min(100, prob * 100))}%` }}
                          />
                        </div>
                        <span className="w-12 text-right text-[11px] text-slate-300">
                          {(prob * 100).toFixed(1)}%
                        </span>
                      </div>
                    );
                  })}
                </div>

                <div className="p-3 bg-slate-950 rounded-lg border border-slate-800/80 text-xs text-slate-300 space-y-1">
                  <div className="flex items-center gap-1.5 font-semibold text-emerald-400">
                    <IconShield />
                    <span>Hardware Topologies & Verification:</span>
                  </div>
                  <p className="text-[11px] text-slate-400 leading-relaxed">
                    {currentProc.description}
                  </p>
                </div>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="w-full bg-slate-900/60 border-t border-slate-800 px-6 py-3 flex justify-between text-xs text-slate-400 font-mono">
            <span>QFF 2026 Phase 2 Track 3 (PS-S3) | StepWise-Q</span>
            <span>Exact Statevector & Bloch Vector Simulation</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
